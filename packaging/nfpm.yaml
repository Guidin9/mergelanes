# Built by scripts/build-linux.sh: VERSION=0.2.1 ARCH=amd64 nfpm package -p deb -f packaging/nfpm.yaml
name: mergelanes
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Mert Demirdöven <206123269+Guidin9@users.noreply.github.com>
vendor: Mert Demirdöven
homepage: https://github.com/Guidin9/mergelanes
license: GPL-3.0-or-later AND MIT
description: |
  Use all your network adapters at once.
  MergeLanes spreads every new connection over Wi-Fi, Ethernet and phone
  tethers, so downloads get the combined speed, and keeps games and voice
  chat on the lowest-latency link. It needs no server and no VPN. The tray icon needs StatusNotifierItem support.
contents:
  - src: ./mergelanes
    dst: /usr/bin/mergelanes
    file_info:
      mode: 0755
  - src: packaging/io.github.guidin9.mergelanes.desktop
    dst: /usr/share/applications/io.github.guidin9.mergelanes.desktop
  - src: packaging/io.github.guidin9.mergelanes.metainfo.xml
    dst: /usr/share/metainfo/io.github.guidin9.mergelanes.metainfo.xml
  - src: packaging/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/mergelanes/copyright
    packager: deb
  - src: LICENSE-net-merge
    dst: /usr/share/doc/mergelanes/LICENSE-net-merge
  - src: LICENSE
    dst: /usr/share/licenses/mergelanes/LICENSE
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/mergelanes/LICENSE
    packager: apk
  - src: LICENSE
    dst: /usr/share/licenses/mergelanes/LICENSE
    packager: archlinux
scripts:
  postinstall: packaging/postinstall.sh
overrides:
  deb:
    depends:
      - libcap2-bin
  rpm:
    recommends:
      - libcap
  apk:
    depends:
      - libcap-utils
  archlinux:
    depends:
      - libcap
