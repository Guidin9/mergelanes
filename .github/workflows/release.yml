name: release
# Push a tag like v0.2.0 to build the installer and portable zip and publish a GitHub release.
# The release notes are that version's section of CHANGELOG.md; the run fails early if it's missing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: scripts/release-notes.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v')) -Out release-notes.md
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          scripts/build.ps1 -Version $version -RepoUrl "${{ github.server_url }}/${{ github.repository }}"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = 'mergelanes ' + $tag.TrimStart('v')
          $files = Get-ChildItem dist/mergelanes-setup-*.exe, dist/mergelanes-*-portable.zip
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {   # release already created by hand: refresh files and notes
            gh release upload $tag $files --clobber
            gh release edit $tag --title $title --notes-file release-notes.md
          } else {
            gh release create $tag $files --title $title --notes-file release-notes.md
          }

  # Adds the Linux builds to the release the Windows job creates: for every CPU a tarball, a .deb,
  # .rpm, .apk and an Arch package. Pure Go, so no cgo and no cross-compiler: one runner builds them all.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: Build tarballs and packages
        run: |
          v='${{ github.ref_name }}'; v=${v#v}
          scripts/build-linux.sh "$v" dist
          ls dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/* --clobber

  # Version-less copies of the downloads, for links that always give the newest release.
  aliases:
    needs: [linux, macos]
    uses: ./.github/workflows/release-aliases.yml
    with:
      tag: ${{ github.ref_name }}

  # Adds the macOS build to the release the Windows job creates.
  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal binary
        run: |
          v='${{ github.ref_name }}'; v=${v#v}
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -ldflags "-s -w -X main.version=$v" -o mergelanes-$arch ./cmd/mergelanes
          done
          lipo -create -output mergelanes mergelanes-arm64 mergelanes-amd64
          codesign --force --sign - mergelanes   # ad-hoc: lipo invalidates the per-arch signatures
          mkdir dist
          tar -czf dist/mergelanes-$v-macos-universal.tar.gz mergelanes LICENSE LICENSE-net-merge THIRD-PARTY-NOTICES.md
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/mergelanes-*-macos-universal.tar.gz --clobber
