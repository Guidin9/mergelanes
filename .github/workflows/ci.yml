name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Loopback aliases for the engine tests
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2/32
          sudo ifconfig lo0 alias 127.0.0.3/32
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-build darwin/amd64
        if: runner.os == 'macOS'
        run: CGO_ENABLED=1 GOARCH=amd64 go build -o /dev/null ./cmd/mergelanes

  # The tests on every other CPU Linux packages are built for: 386 runs natively on the x86-64
  # runner, the rest under qemu user-mode emulation (s390x is big-endian, the rest little).
  linux-arches:
    runs-on: ubuntu-24.04   # ubuntu-latest is 26.04 now, where qemu-user-static no longer installs
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: "386"}
          - {goarch: arm, goarm: "7", qemu: qemu-arm-static}
          - {goarch: arm, goarm: "6", qemu: qemu-arm-static}
          - {goarch: riscv64, qemu: qemu-riscv64-static}
          - {goarch: ppc64le, qemu: qemu-ppc64le-static}
          - {goarch: s390x, qemu: qemu-s390x-static}
          - {goarch: loong64, qemu: qemu-loongarch64-static}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install qemu
        if: matrix.qemu
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Vet and test
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test -timeout 10m ${{ matrix.qemu && format('-exec {0}', matrix.qemu) || '' }} ./...

  # System-wide mode for real, as root: TUN, routes, balancing over two uplinks, off, kill -9.
  linux-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o mergelanes ./cmd/mergelanes
      - run: bash scripts/linux-e2e.sh ./mergelanes
      - name: mergelanes logs
        if: always()
        run: cat /tmp/mergelanes-e2e/*.log 2>/dev/null || true

  # System-wide mode for real, as root: utun, routes, relaying, off, kill -9. One NIC, so no balancing.
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o mergelanes ./cmd/mergelanes
      - run: bash scripts/macos-smoke.sh ./mergelanes
      - name: mergelanes logs
        if: always()
        run: cat /tmp/mergelanes-smoke*.log 2>/dev/null || true

  # System-wide mode for real, as admin: Wintun, routes, the internet probe over pinned sockets,
  # relaying and off; also with the NIC demoted to secondary and with weak host send/forwarding on.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: choco install innosetup --no-progress -y
      # The release build itself, so the smoke test runs the exe that ships.
      - shell: pwsh
        run: |
          scripts/build.ps1
          if ((Get-Item dist\mergelanes-tray.exe).VersionInfo.ProductName -ne 'MergeLanes') { throw 'mergelanes-tray.exe has no version info' }
          go build -o dist/winfakeup.exe ./scripts/winfakeup
          scripts/windows-smoke.ps1 dist\mergelanes.exe

  # The Linux packages for every CPU, built the way the release builds them, plus the desktop and
  # AppStream files checked.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - name: Build the packages for every CPU
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          scripts/build-linux.sh 0.0.0 dist
          ls dist | wc -l
      - name: Validate the desktop and AppStream files
        run: |
          desktop-file-validate packaging/io.github.guidin9.mergelanes.desktop
          appstreamcli validate --no-net packaging/io.github.guidin9.mergelanes.metainfo.xml
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./dist/mergelanes_0.0.0_amd64.deb
          getcap /usr/bin/mergelanes | tee /dev/stderr | grep -q cap_net_admin
          mergelanes version
